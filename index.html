
 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Бронирование рекламы</title>
    <!-- Подключение скрипта Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            user-select: none;
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
            text-align: center;
        }

        .section-title {
            font-size: 14px;
            color: var(--hint-color);
            margin: 15px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .format-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .format-card {
            background-color: var(--secondary-bg);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .format-card.active {
            border-color: var(--button-color);
            background-color: rgba(36, 129, 204, 0.1);
        }

        .format-name {
            font-weight: 600;
            font-size: 15px;
        }

        .format-price {
            font-weight: bold;
            color: var(--button-color);
        }

        input[type="date"] {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--hint-color);
            background-color: var(--secondary-bg);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .submit-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h2>📅 Бронирование рекламы</h2>

    <div class="section-title">Выберите формат</div>
    <div class="format-grid">
        <div class="format-card active" onclick="selectFormat(this, 'Пост 1/24', '1000')">
            <span class="format-name">Пост 1/24</span>
            <span class="format-price">1000 ₽</span>
        </div>
        <div class="format-card" onclick="selectFormat(this, 'Пост 2/48', '1500')">
            <span class="format-name">Пост 2/48</span>
            <span class="format-price">1500 ₽</span>
        </div>
        <div class="format-card" onclick="selectFormat(this, 'Без удаления (Навсегда)', '2500')">
            <span class="format-name">Навсегда</span>
            <span class="format-price">2500 ₽</span>
        </div>
    </div>

    <div class="section-title">Выберите дату</div>
    <input type="date" id="booking-date">

    <button class="submit-btn" id="submit-btn">Забронировать</button>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрываем окно во весь экран

        let selectedFormat = "Пост 1/24";
        let selectedPrice = "1000";

        // Устанавливаем сегодняшнюю дату по умолчанию
        const dateInput = document.getElementById('booking-date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;
        dateInput.min = today;

        // Функция выбора формата
        function selectFormat(element, formatName, price) {
            document.querySelectorAll('.format-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
            selectedFormat = formatName;
            selectedPrice = price;
        }

        // Обработка клика по кнопке "Забронировать"
        document.getElementById('submit-btn').addEventListener('click', () => {
            const chosenDate = dateInput.value;

            if (!chosenDate) {
                alert('Пожалуйста, выберите дату!');
                return;
            }

            // Данные, которые отправляем в bot.py
            const dataToSend = {
                format: selectedFormat,
                price: selectedPrice + " ₽",
                date: chosenDate
            };

            // Главный метод: отправляет JSON боту и заставляет Telegram закрыть Mini App
            tg.sendData(JSON.stringify(dataToSend));
        });
    </script>
</body>
</html>
