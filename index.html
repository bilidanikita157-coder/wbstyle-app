<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Бронирование рекламы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #000000);
      --hint-color: var(--tg-theme-hint-color, #999999);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h2 { font-size: 18px; margin: 16px 0 8px 0; }
    .cards { display: flex; flex-direction: column; gap: 10px; }

    .card {
      background-color: var(--secondary-bg);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s;
    }

    .card.selected { border-color: var(--button-color); }
    .card-title { font-weight: 600; font-size: 15px; }
    .card-price { color: var(--button-color); font-weight: bold; }

    input[type="date"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--hint-color);
      background-color: var(--secondary-bg);
      color: var(--text-color);
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
    }

    .btn-submit {
      display: none;
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background-color: var(--button-color);
      color: var(--button-text-color);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-submit.visible { display: block; }
  </style>
</head>
<body>

  <h2>1. Выберите формат</h2>
  <div class="cards">
    <div class="card" onclick="selectFormat(this, '1/24 (1 час топа / 24 в ленте)', '1 500 ₽')">
      <span class="card-title">1/24 (1 час топа)</span>
      <span class="card-price">1 500 ₽</span>
    </div>
    <div class="card" onclick="selectFormat(this, '2/48 (2 часа топа / 48 в ленте)', '2 500 ₽')">
      <span class="card-title">2/48 (2 часа топа)</span>
      <span class="card-price">2 500 ₽</span>
    </div>
    <div class="card" onclick="selectFormat(this, 'Без удаления (Закреп 24 часа)', '4 000 ₽')">
      <span class="card-title">Без удаления</span>
      <span class="card-price">4 000 ₽</span>
    </div>
  </div>

  <h2>2. Выберите дату</h2>
  <input type="date" id="datePicker" onchange="checkSelection()">

  <button class="btn-submit" id="submitBtn" onclick="sendBooking()">Забронировать</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let selectedFormat = null;
    let selectedPrice = null;

    const dateInput = document.getElementById('datePicker');
    const today = new Date().toISOString().split('T')[0];
    dateInput.setAttribute('min', today);

    function selectFormat(element, format, price) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
      element.classList.add('selected');
      selectedFormat = format;
      selectedPrice = price;
      checkSelection();
    }

    function checkSelection() {
      const dateValue = dateInput.value;
      const submitBtn = document.getElementById('submitBtn');
      if (selectedFormat && dateValue) {
        submitBtn.classList.add('visible');
      } else {
        submitBtn.classList.remove('visible');
      }
    }

    function sendBooking() {
      const dateValue = dateInput.value;
      if (!selectedFormat || !dateValue) return;

      const payload = {
        format: selectedFormat,
        price: selectedPrice,
        date: dateValue
      };

      tg.sendData(JSON.stringify(payload));
    }
  </script>
</body>
</html>
